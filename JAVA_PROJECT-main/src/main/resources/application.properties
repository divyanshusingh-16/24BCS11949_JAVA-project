# ==============================================================
# Server Configuration
# ==============================================================
server.port=8080

# ==============================================================
# MySQL Database Configuration
# ==============================================================
# Note: createDatabaseIfNotExist=true will automatically create 'student_db' if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# Spring Data JPA / Hibernate Configuration
# ==============================================================
# ddl-auto: update (automatically creates/updates tables based on entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================================================
# Logging Configuration
# ==============================================================
logging.level.com.studentmanagement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

